server:
  port: 8083

spring:
  application:
    name: ms-andesstay-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/andesstay?useSSL=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: report-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firma (JWKS), vigencia, issuer y audience del JWT de Azure AD
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/discovery/v2.0/keys
          # Azure AD puede emitir aud como api://<clientId> o como el GUID del clientId
          audiences:
            - api://${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}
            - ${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}

andesstay:
  kafka:
    topics:
      reservations-events: reservations.events
